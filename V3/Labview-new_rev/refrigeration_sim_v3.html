const EDU={
  comp:{title:'Compressor',body:'Draws in low-pressure superheated vapor, compresses to high pressure. Enthalpy rises: h₂ > h₁. Any liquid at inlet = hydraulic lock = catastrophic failure in seconds.',crit:'SH must be > 10°F always. Discharge temp must stay below 220°F for R290.'},
  get cond(){ return specs.cond_type==='air'
    ?{title:'Condenser (Air-Cooled)',body:'Rejects heat to ambient air via fins and fan. Higher condensing temps than water-cooled. Performance degrades in hot weather. Fan speed and CFM determine heat rejection rate.',crit:'Dirty fins raise head pressure. Fan failure = rapid pressure rise. High ambient = higher energy use.'}
    :{title:'Condenser (Water-Cooled)',body:'Rejects heat to water loop. Vapor desuperheats → condenses → subcools at constant pressure. Water temperature sets condensing pressure and therefore everything downstream.',crit:'Low SC (<3°F) means flash gas forms in liquid line. High approach temp means fouling or low water flow.'};
  },
  txv:{title:'TXV (Thermostatic Expansion Valve)',body:'Isenthalpic pressure drop. Liquid flashes to two-phase (S4). TXV bulb senses suction temp and throttles to maintain ~10°F SH at coil outlet. It is a feedback controller.',crit:'Open too far → floods evap → SH→0 → liquid slugging. Closed too far → starves evap → very high SH → hot discharge.'},
  evap:{title:'Evaporator Coil',body:'Two-phase mix enters, boils at constant pressure. WET ZONE = liquid+vapor coexisting, all heat goes to phase change. SH ZONE = all liquid gone, refrigerant superheating. High SH = starved. Near-zero SH = flooded.',crit:'T_sat < 32°F + restricted airflow → ice buildup. Wet zone filling entire coil → liquid to compressor.'},
};

let _selEl=null;
function selComp(id){
  _selEl=id.replace(/_(box|g|tri1|tri2|gap|needle|boundary|wet|dry|shlabel|sub)/,'').replace(/_[0-9]+$/,'').replace(/_(c[0-9]+)$/,'');
  renderInfo();
}
function selState(id){ _selEl=id; renderInfo(); }

function renderInfo(){
  const cfg=CONFIGS[currentCfg];
  const s=physState;
  if(!s) return;
  const panel=document.getElementById('info-panel');
  let html='';

  // Status section
  const isShared=!cfg.cassette;
  let smsg='',scls='ok';

  // Defrost override
  if(s.defrost || (Array.isArray(s) && s[0] && s[0].defrost)){
    smsg='HOT GAS DEFROST ACTIVE — not in cooling mode';scls='warn';
    html+=`<div class="is"><h3>Defrost Status</h3>
      <div class="fd warn" style="border-left-color:#ff6000;animation:blk 1s infinite">${smsg}</div>
      <div class="sr"><span class="sl">Stage</span><span class="sv">${Math.round((s.defrost_stage||0.5)*100)}%</span></div>
      <div class="sr"><span class="sl">Coil Temp</span><span class="sv">${(s.T_coil||0).toFixed(1)}°F</span></div>
      ${s.Q_defrost?`<div class="sr"><span class="sl">Q_defrost</span><span class="sv">${(s.Q_defrost/1000).toFixed(1)}k BTU/hr</span></div>`:''}
      <div class="sr"><span class="sl">P_suction (elevated)</span><span class="sv">${s.P_suction?s.P_suction.toFixed(1):'-'} PSIG</span></div>
      <div class="sr"><span class="sl">PR (reduced)</span><span class="sv">${s.PR?s.PR.toFixed(2):'-'}</span></div>
      <div class="fd ok" style="border-left-color:#2a5070;margin-top:4px">Fan OFF. Hot gas flowing through evap coil via SOV. TXV bypassed.</div>
    </div>`;
  } else {
    if(isShared){
      const mods=s.modules;
      const worstSH=Math.min(...mods.map(m=>m.SH));
      const shSpread=mods.length>1?Math.max(...mods.map(m=>m.SH))-worstSH:0;
      if(worstSH<0){smsg='LIQUID slugging risk — SH negative';scls='crit';}
      else if(worstSH<5){smsg='Flood risk — superheat near zero';scls='crit';}
      else if(s.SH_total>38||s.SC<2){smsg='Undercharge / high SH — evap starved';scls='warn';}
      else if(shSpread>12){smsg=`Module SH imbalance — spread: ${shSpread.toFixed(0)}°F`;scls='warn';}
      else{smsg='System operating normally';scls='ok';}
    } else {
      const anyBad=s.some(u=>u.modules[0].SH<5||u.SC<3);
      smsg=anyBad?'One or more units in warning':'All units operating normally';
      scls=anyBad?'warn':'ok';
    }
    html+=`<div class="is"><h3>Status</h3><div class="fd ${scls}">${smsg}</div></div>`;
  }

  // State points
  html+='<div class="is"><h3>State Points</h3>';
  if(isShared){
    const mods=s.modules;
    html+=`<div class="sr"><span class="sl">P_suction</span><span class="sv">${s.P_suction.toFixed(1)} PSIG</span></div>`;
    html+=`<div class="sr"><span class="sl">P_disch</span><span class="sv">${s.P_disch.toFixed(1)} PSIG</span></div>`;
    html+=`<div class="sr"><span class="sl" style="color:#ffc107">Subcooling (S3)</span><span class="sv ${s.SC<2?'crit':s.SC<6?'warn':'ok'}">${s.SC.toFixed(1)}°F</span></div>`;
    if(s.SC_at_txv!==undefined && (specs.dP_fd||0)>0){
      const sctx=s.SC_at_txv;
      html+=`<div class="sr" style="padding-left:10px"><span class="sl" style="color:#ffc107">SC at TXV (after FD)</span><span class="sv ${sctx<0?'crit':sctx<3?'warn':'ok'}">${sctx.toFixed(1)}°F</span></div>`;
    }
    if((specs.dP_dist||0)>0){
      html+=`<div class="sr" style="padding-left:10px"><span class="sl" style="color:#9c27b0">Distributor dP</span><span class="sv">${specs.dP_dist} PSIG</span></div>`;
    }
    html+=`<div class="sr"><span class="sl">T_disch (S2)</span><span class="sv ${s.T_disch>215?'crit':s.T_disch>195?'warn':'ok'}">${s.T_disch.toFixed(1)}°F</span></div>`;
    html+=`<div class="sr"><span class="sl">SH Comp.In (S1)</span><span class="sv ${s.SH_total<5?'crit':s.SH_total>30?'warn':'ok'}">${s.SH_total.toFixed(1)}°F</span></div>`;
    for(let i=0;i<mods.length;i++){
      const m=mods[i];
      html+=`<div class="sr" style="padding-left:10px"><span class="sl" style="color:#00b4ff">S1 ${cfg.modules[i]}</span><span class="sv ${m.SH<5?'crit':m.SH>30?'warn':'ok'}">${m.SH.toFixed(1)}°F SH</span></div>`;
    }
  } else {
    for(let i=0;i<s.length;i++){
      const u=s[i]; const m=u.modules[0];
      html+=`<div class="sr"><span class="sl" style="color:#4db8ff">${cfg.modules[i]}</span><span class="sv"></span></div>`;
      html+=`<div class="sr" style="padding-left:8px"><span class="sl">SH</span><span class="sv ${m.SH<5?'crit':m.SH>30?'warn':'ok'}">${m.SH.toFixed(1)}°F</span></div>`;
      html+=`<div class="sr" style="padding-left:8px"><span class="sl">SC</span><span class="sv ${u.SC<2?'crit':u.SC<6?'warn':'ok'}">${u.SC.toFixed(1)}°F</span></div>`;
      html+=`<div class="sr" style="padding-left:8px"><span class="sl">T_disch</span><span class="sv ${u.T_disch>215?'crit':u.T_disch>195?'warn':'ok'}">${u.T_disch.toFixed(1)}°F</span></div>`;
    }
  }
  html+='</div>';

  // Performance section
  html+='<div class="is"><h3>Performance</h3>';
  if(isShared){
    html+=`<div class="sr"><span class="sl">Mass Flow</span><span class="sv">${s.m_dot.toFixed(0)} lb/hr</span></div>`;
    html+=`<div class="sr"><span class="sl">Q_evap</span><span class="sv">${(s.Q_evap/1000).toFixed(1)}k BTU/hr</span></div>`;
    html+=`<div class="sr"><span class="sl">Capacity</span><span class="sv">${s.Q_tons.toFixed(2)} tons</span></div>`;
    html+=`<div class="sr"><span class="sl">W_comp</span><span class="sv">${(s.W_comp/1000).toFixed(1)}k BTU/hr (${s.W_comp_kW.toFixed(2)} kW)</span></div>`;
    html+=`<div class="sr"><span class="sl" style="color:#00e676">COP</span><span class="sv ${s.COP<2?'warn':s.COP<1.5?'crit':'ok'}">${s.COP.toFixed(2)}</span></div>`;
    html+=`<div class="sr"><span class="sl">Vol. Eff.</span><span class="sv">${(s.eta_vol*100).toFixed(0)}%</span></div>`;
    html+=`<div class="sr"><span class="sl">Pr.Ratio</span><span class="sv">${s.PR.toFixed(2)}</span></div>`;
  } else {
    let totalQ=0, totalW=0, totalMdot=0;
    for(let i=0;i<s.length;i++){
      const u=s[i];
      totalQ+=u.Q_evap; totalW+=u.W_comp; totalMdot+=u.m_dot;
      html+=`<div class="sr"><span class="sl" style="color:#4db8ff">${cfg.modules[i]}</span><span class="sv">${u.Q_tons.toFixed(2)} tons | COP ${u.COP.toFixed(2)}</span></div>`;
    }
    html+=`<div class="sr"><span class="sl" style="color:#ffc107">Total</span><span class="sv">${(totalQ/12000).toFixed(2)} tons | ${totalMdot.toFixed(0)} lb/hr</span></div>`;
  }
  html+='</div>';

  // Enthalpy state points
  html+='<div class="is"><h3>Enthalpy Map (kJ/kg)</h3>';
  if(isShared){
    html+=`<div class="sr"><span class="sl">h1 (comp.in)</span><span class="sv">${s.h1.toFixed(1)}</span></div>`;
    html+=`<div class="sr"><span class="sl">h2 (comp.out)</span><span class="sv">${s.h2.toFixed(1)}</span></div>`;
    html+=`<div class="sr"><span class="sl">h3 (cond.out)</span><span class="sv">${s.h3.toFixed(1)}</span></div>`;
    html+=`<div class="sr"><span class="sl">h4 (TXV out)</span><span class="sv">${s.h4.toFixed(1)}</span></div>`;
    html+=`<div class="sr"><span class="sl">Refrig. effect</span><span class="sv">${(s.h1-s.h4).toFixed(1)} kJ/kg</span></div>`;
    html+=`<div class="sr"><span class="sl">Comp. work</span><span class="sv">${(s.h2-s.h1).toFixed(1)} kJ/kg</span></div>`;
  } else {
    for(let i=0;i<s.length;i++){
      const u=s[i];
      html+=`<div class="sr"><span class="sl" style="color:#4db8ff">${cfg.modules[i]}</span><span class="sv">h1=${u.h1.toFixed(0)} h2=${u.h2.toFixed(0)} h3=${u.h3.toFixed(0)}</span></div>`;
    }
  }
  html+='</div>';

  // Live diagnostics
  html+='<div class="is"><h3>Live Diagnostics</h3>';
  const findings=[];
  if(isShared){
    const mods=s.modules;
    const worstSH=Math.min(...mods.map(m=>m.SH));
    const shSpread=mods.length>1?Math.max(...mods.map(m=>m.SH))-worstSH:0;
    if(worstSH<0) findings.push({c:'crit',t:'CP-1: Liquid slugging — SH negative'});
    else if(worstSH<5) findings.push({c:'crit',t:'TX-2: TXV flooding — SH near zero'});
    else if(s.SH_total>35) findings.push({c:'warn',t:'TX-1: TXV starved or undercharge'});
    if(s.SC<2) findings.push({c:'crit',t:'SI-1: Flash gas in liquid line — SC < 2°F'});
    else if(s.SC<6) findings.push({c:'warn',t:'RF-2: Low subcooling — possible undercharge'});
    if(s.T_disch>215) findings.push({c:'crit',t:'CP-2: Discharge temp above R290 limit'});
    if(shSpread>12) findings.push({c:'warn',t:`EV-2: Module SH imbalance — ${shSpread.toFixed(0)}°F spread`});
    for(let i=0;i<mods.length;i++){
      const m=mods[i];
      if(m.T_1b>m.T_1a) findings.push({c:'warn',t:`DI-3: Flash gas at ${cfg.modules[i]} distributor (T_1b > T_1a)`});
    }
    if(s.SH_total-Math.max(...mods.map(m=>m.SH))>5) findings.push({c:'warn',t:'SL-1: Suction line heat pickup detected'});
    if(findings.length===0) findings.push({c:'ok',t:'No active faults detected'});
  } else {
    for(let i=0;i<s.length;i++){
      const u=s[i]; const m=u.modules[0];
      if(m.SH<0) findings.push({c:'crit',t:`CP-1 ${cfg.modules[i]}: Liquid slugging`});
      else if(m.SH<5) findings.push({c:'crit',t:`TX-2 ${cfg.modules[i]}: TXV flooding`});
      else if(m.SH>35) findings.push({c:'warn',t:`TX-1 ${cfg.modules[i]}: High superheat`});
      if(u.SC<2) findings.push({c:'crit',t:`${cfg.modules[i]}: Flash gas in liquid line`});
      if(u.T_disch>215) findings.push({c:'crit',t:`CP-2 ${cfg.modules[i]}: Discharge temp critical`});
    }
    if(findings.length===0) findings.push({c:'ok',t:'All units operating normally'});
  }
  findings.forEach(f=>{ html+=`<div class="fd ${f.c}">${f.t}</div>`; });
  html+='</div>';

  // Solver Prediction comparison — shared or cassette
  if(solverState){
    // Helper to render one solver comparison block
    const _renderSolverBlock=(sol,curr,unitLabel)=>{
      let h='';
      if(sol.converged){
        const hdr=unitLabel?`Solver — ${unitLabel}`:'Solver Prediction';
        h+=`<div class="solver-hdr"><h3>${hdr}</h3><span class="solver-badge ok">CONVERGED (${sol.iterations} iter)</span></div>`;
        const rows=[
          ['T_evap',sol.T_evap,curr.T_evap,'°F'],
          ['T_cond',sol.T_cond,curr.T_cond,'°F'],
          ['SH',sol.SH_total,curr.SH_total,'°F'],
          ['SC',sol.SC,curr.SC,'°F'],
          ['P_suction',sol.P_suction,curr.P_suction,'PSIG'],
          ['P_disch',sol.P_disch,curr.P_disch,'PSIG'],
          ['T_disch',sol.T_disch,curr.T_disch,'°F'],
          ['Pr.Ratio',sol.PR,curr.PR,''],
          ['Mass Flow',sol.m_dot,curr.m_dot,'lb/hr'],
          ['COP',sol.COP,curr.COP,''],
          ['Capacity',sol.Q_tons,curr.Q_tons,'tons'],
        ];
        h+='<div style="display:flex;justify-content:space-between;padding:2px 0;font-size:7px;color:#2a5070;letter-spacing:1px;text-transform:uppercase">';
        h+='<span style="flex:1">Param</span><span style="min-width:55px;text-align:right">Predicted</span>';
        if(!autoSolve) h+='<span style="min-width:55px;text-align:right">Slider</span><span style="min-width:50px;text-align:right">Delta</span>';
        h+='</div>';
        const fmt=v=>Math.abs(v)<10?v.toFixed(2):v.toFixed(1);
        rows.forEach(([lbl,pred,cur,unit])=>{
          const p=typeof pred==='number'?pred:0;
          const c=typeof cur==='number'?cur:0;
          const d=p-c;
          const dcls=Math.abs(d)<0.5?'ok':d>0?'pos':'neg';
          h+=`<div class="cmp-row"><span class="cmp-lbl">${lbl}</span><span class="cmp-pred">${fmt(p)} ${unit}</span>`;
          if(!autoSolve) h+=`<span class="cmp-curr">${fmt(c)} ${unit}</span><span class="cmp-delta ${dcls}">${d>=0?'+':''}${fmt(d)}</span>`;
          h+='</div>';
        });
        if(sol.T_water_out!==undefined){
          const sinkLbl=sol.cond_type==='air'?'T_air_out':'T_water_out';
          h+=`<div class="cmp-row"><span class="cmp-lbl">${sinkLbl}</span><span class="cmp-pred">${sol.T_water_out.toFixed(1)}°F</span>`;
          if(!autoSolve) h+='<span class="cmp-curr">--</span><span class="cmp-delta ok">--</span>';
          h+='</div>';
        }
      } else {
        const hdr=unitLabel?`Solver — ${unitLabel}`:'Solver Prediction';
        h+=`<div class="solver-hdr"><h3>${hdr}</h3><span class="solver-badge fail">NO CONVERGE</span></div>`;
        h+=`<div class="fd warn">${sol.error||'Solver did not converge — check component specs'}</div>`;
      }
      return h;
    };

    html+='<div class="is">';
    if(isShared){
      // Single system
      html+=_renderSolverBlock(solverState,s,null);
    } else {
      // Cassette — per-unit
      for(let i=0;i<solverState.length;i++){
        const unitSol=solverState[i];
        const unitPhys=s[i]||{};
        html+=_renderSolverBlock(unitSol,unitPhys,cfg.modules[i]);
        if(i<solverState.length-1) html+='<div style="border-top:1px dashed #1a3050;margin:6px 0"></div>';
      }
    }
    html+='</div>';
  }

  // Education
  const ekey=_selEl?(['comp','cond','txv','evap'].find(k=>_selEl.startsWith(k))):null;
  if(ekey && EDU[ekey]){
    const e=EDU[ekey];
    html+=`<div class="is"><h3>${e.title}</h3>
      <p class="edu">${e.body}</p>
      <p style="font-size:8px;color:#4db8ff;margin:6px 0 3px;letter-spacing:1px">⚠ FAILURE MODE</p>
      <p class="edu">${e.crit}</p>
    </div>`;
  } else {
    html+=`<div class="is"><h3>How to Interact</h3>
      <p class="edu">Use controls below to change charge level and TXV opening per module. Watch pipes, evap zones, and diagnostics respond in real-time based on R290 thermodynamics.<br><br>Click any component for education.</p>
    </div>`;
  }

  panel.innerHTML=html;
}

// ══════════════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════════════
setConfig('nonmod');
drawSpecsPanel();
</script>
